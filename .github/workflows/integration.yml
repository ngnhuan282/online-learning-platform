name: System integration
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
        working-directory: frontend/web
      - run: npm run lint -- --max-warnings=0
        working-directory: frontend/web
      - run: npm test
        working-directory: frontend/web
      - run: npm run build
        working-directory: frontend/web

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B -ntp -f backend/pom.xml verify

  compose:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate production configuration contracts
        run: node --test infra/scripts/production-env.test.mjs
      - run: node infra/scripts/create-integration-env.mjs
      - name: Validate local and staging Compose
        run: |
          docker compose --env-file .tmp/integration.env --profile backend config -q
          docker compose --env-file .tmp/integration.env -f compose.yaml -f compose.staging.yaml --profile backend config -q
      - name: Start isolated MySQL and backend
        run: docker compose --env-file .tmp/integration.env -p auth-integration --profile backend up --build -d --wait --wait-timeout 300
      - name: Seed disposable demo fixtures
        run: docker compose --env-file .tmp/integration.env -p auth-integration exec -T mysql sh -c 'MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql -uroot < /seed/seed-data.sql'
      - run: node infra/scripts/integration-smoke.mjs --demo
      - name: Verify dependency failure and persistent data on isolated stack
        run: node infra/scripts/runtime-smoke.mjs --isolated
        env:
          SMOKE_ENV_FILE: .tmp/integration.env
      - name: Build and start staging web
        run: docker compose --env-file .tmp/integration.env -p auth-integration -f compose.yaml -f compose.staging.yaml --profile backend up --build -d --wait --wait-timeout 300
      - name: Verify staging SPA and API proxy
        run: node infra/scripts/staging-smoke.mjs --demo
      - name: Stop first disposable stack before production-overlay checks
        run: docker compose --env-file .tmp/integration.env -p auth-integration -f compose.yaml -f compose.staging.yaml --profile backend down -v
      - run: node infra/scripts/create-production-test-env.mjs
      - name: Start production overlay with isolated fixtures
        run: docker compose --parallel 1 --env-file .tmp/production-integration.env -p production-integration -f compose.yaml -f compose.production.yaml --profile backend up --build -d --wait --wait-timeout 300
        env:
          COMPOSE_BAKE: "false"
      - name: Verify production behavior without external integrations
        run: node infra/scripts/production-smoke.mjs --test-stack
      - name: Verify backup integrity and complete restore
        run: node infra/scripts/production-backup-smoke.mjs --test-stack
      - name: Show health on failure
        if: failure()
        run: docker compose --env-file .tmp/integration.env -p auth-integration --profile backend ps -a
      - name: Stop disposable stack
        if: always()
        run: docker compose --env-file .tmp/integration.env -p auth-integration -f compose.yaml -f compose.staging.yaml --profile backend down -v
      - name: Stop disposable production stack
        if: always()
        run: |
          if [ -f .tmp/production-integration.env ]; then
            docker compose --env-file .tmp/production-integration.env -p production-integration -f compose.yaml -f compose.production.yaml --profile backend down -v
          fi
