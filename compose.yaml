# MySQL alone: docker compose up -d mysql
# Full backend: docker compose --profile backend up --build -d
x-backend-defaults: &backend-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  healthcheck:
    test: ["CMD-SHELL", "curl --fail --silent --max-time 4 http://127.0.0.1:$${SERVER_PORT}/actuator/health/readiness >/dev/null"]
    interval: 10s
    timeout: 5s
    start_period: 90s
    retries: 12

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
      COURSE_DB_PASSWORD: ${COURSE_DB_PASSWORD:?Set COURSE_DB_PASSWORD in .env}
      LEARNING_DB_PASSWORD: ${LEARNING_DB_PASSWORD:?Set LEARNING_DB_PASSWORD in .env}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD in .env}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?Set AI_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
      - ./infra/mysql/02-users.sh:/docker-entrypoint-initdb.d/02-users.sh:ro
      - ./infra/mysql/03-auth-migrations.sql:/docker-entrypoint-initdb.d/03-auth-migrations.sql:ro
      - ./infra/mysql/04-course-migrations.sql:/docker-entrypoint-initdb.d/04-course-migrations.sql:ro
      - ./infra/mysql/04-learning-migrations.sql:/docker-entrypoint-initdb.d/04-learning-migrations.sql:ro
      - ./infra/mysql/04-payment-migrations.sql:/docker-entrypoint-initdb.d/04-payment-migrations.sql:ro
      - ./infra/mysql/04-ai-migrations.sql:/docker-entrypoint-initdb.d/04-ai-migrations.sql:ro
      # Run explicitly after service migrations; demo accounts are opt-in.
      - ./infra/mysql/seed-data.sql:/seed/seed-data.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP -h127.0.0.1 -uroot -Nse "SELECT 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    <<: *backend-defaults
    profiles: [backend]
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: auth-service
    environment:
      SERVER_PORT: "8081"
      LOG_FORMAT: ${LOG_FORMAT:-ecs}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 random UTF-8 bytes}
      JWT_ISSUER: ${JWT_ISSUER:-sgedu}
      JWT_ACCESS_TOKEN_SECONDS: ${JWT_ACCESS_TOKEN_SECONDS:-900}
      AUTH_DB_URL: jdbc:mysql://mysql:3306/auth_db
      AUTH_DB_USERNAME: auth_app
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      REFRESH_TOKEN_EXPIRATION_SECONDS: ${REFRESH_TOKEN_EXPIRATION_SECONDS:-604800}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      GOOGLE_LOGIN_ENABLED: ${GOOGLE_LOGIN_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/v1/auth/google/callback/google}
      GOOGLE_FRONTEND_ORIGIN: ${GOOGLE_FRONTEND_ORIGIN:-http://localhost:5173}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      FRONTEND_RESET_URL: ${FRONTEND_RESET_URL:-http://localhost:5173/reset-password}
      RESET_TOKEN_TTL_MINUTES: ${RESET_TOKEN_TTL_MINUTES:-15}
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy

  course-service:
    <<: *backend-defaults
    profiles: [backend]
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: course-service
    environment:
      SERVER_PORT: "8082"
      LOG_FORMAT: ${LOG_FORMAT:-ecs}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 random UTF-8 bytes}
      JWT_ISSUER: ${JWT_ISSUER:-sgedu}
      JWT_ACCESS_TOKEN_SECONDS: ${JWT_ACCESS_TOKEN_SECONDS:-900}
      COURSE_DB_URL: jdbc:mysql://mysql:3306/course_db
      COURSE_DB_USERNAME: course_app
      COURSE_DB_PASSWORD: ${COURSE_DB_PASSWORD}
      LEARNING_SERVICE_URL: http://learning-service:8083
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_DIR: /app/uploads
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-}
      AWS_S3_FORCE_PATH_STYLE: ${AWS_S3_FORCE_PATH_STYLE:-false}
      AWS_PUBLIC_ENDPOINT_URL: ${AWS_PUBLIC_ENDPOINT_URL:-}
    volumes:
      - course_uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy

  rustfs:
    profiles: [s3]
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadminsecret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  learning-service:
    <<: *backend-defaults
    profiles: [backend]
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: learning-service
    environment:
      SERVER_PORT: "8083"
      LOG_FORMAT: ${LOG_FORMAT:-ecs}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 random UTF-8 bytes}
      JWT_ISSUER: ${JWT_ISSUER:-sgedu}
      JWT_ACCESS_TOKEN_SECONDS: ${JWT_ACCESS_TOKEN_SECONDS:-900}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN to at least 32 random UTF-8 bytes}
      COURSE_SERVICE_URL: http://course-service:8082
      LEARNING_DB_URL: jdbc:mysql://mysql:3306/learning_db
      LEARNING_DB_USERNAME: learning_app
      LEARNING_DB_PASSWORD: ${LEARNING_DB_PASSWORD}
      NOTIFICATION_EVENT_API_KEY: ${NOTIFICATION_EVENT_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
      course-service:
        condition: service_healthy

  payment-service:
    <<: *backend-defaults
    profiles: [backend]
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: payment-service
    environment:
      SERVER_PORT: "8084"
      LOG_FORMAT: ${LOG_FORMAT:-ecs}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 random UTF-8 bytes}
      JWT_ISSUER: ${JWT_ISSUER:-sgedu}
      JWT_ACCESS_TOKEN_SECONDS: ${JWT_ACCESS_TOKEN_SECONDS:-900}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Set INTERNAL_SERVICE_TOKEN to at least 32 random UTF-8 bytes}
      COURSE_SERVICE_URL: http://course-service:8082
      LEARNING_SERVICE_URL: http://learning-service:8083
      PAYMENT_DB_URL: jdbc:mysql://mysql:3306/payment_db
      PAYMENT_DB_USERNAME: payment_app
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      PAYMENT_MOCK_ENABLED: ${PAYMENT_MOCK_ENABLED:-false}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_PAYMENT_URL: ${VNPAY_PAYMENT_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:8080/api/v1/payments/vnpay/return}
      VNPAY_IPN_URL: ${VNPAY_IPN_URL:-}
      VNPAY_EXPIRE_MINUTES: ${VNPAY_EXPIRE_MINUTES:-15}
      VNPAY_RESULT_URL: ${VNPAY_RESULT_URL:-http://localhost:5173/payment/result}
    depends_on:
      mysql:
        condition: service_healthy
      course-service:
        condition: service_healthy
      learning-service:
        condition: service_healthy

  ai-service:
    <<: *backend-defaults
    profiles: [backend, ai]
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: ai-service
    environment:
      SERVER_PORT: "8085"
      LOG_FORMAT: ${LOG_FORMAT:-ecs}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 random UTF-8 bytes}
      JWT_ISSUER: ${JWT_ISSUER:-sgedu}
      JWT_ACCESS_TOKEN_SECONDS: ${JWT_ACCESS_TOKEN_SECONDS:-900}
      AI_DB_URL: jdbc:mysql://mysql:3306/ai_db
      AI_DB_USERNAME: ai_app
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-60000}
      AI_DAILY_REQUEST_LIMIT: ${AI_DAILY_REQUEST_LIMIT:-100}
      COURSE_SERVICE_URL: http://course-service:8082
      LEARNING_SERVICE_URL: http://learning-service:8083
    depends_on:
      mysql:
        condition: service_healthy

  api-gateway:
    <<: *backend-defaults
    profiles: [backend]
    build:
      context: .
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE: api-gateway
    environment:
      SERVER_PORT: "8080"
      LOG_FORMAT: ${LOG_FORMAT:-ecs}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to at least 32 random UTF-8 bytes}
      JWT_ISSUER: ${JWT_ISSUER:-sgedu}
      JWT_ACCESS_TOKEN_SECONDS: ${JWT_ACCESS_TOKEN_SECONDS:-900}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      AUTH_SERVICE_URL: http://auth-service:8081
      COURSE_SERVICE_URL: http://course-service:8082
      LEARNING_SERVICE_URL: http://learning-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8084
      AI_SERVICE_URL: http://ai-service:8085
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      course-service:
        condition: service_healthy
      learning-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy

volumes:
  mysql_data:
  course_uploads:
  minio_data:
