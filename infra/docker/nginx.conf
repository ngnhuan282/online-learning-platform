log_format safe '$request_method $status $request_time requestId=$upstream_http_x_request_id';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 210m;
    access_log /dev/stdout safe;
    # Nginx error-level upstream messages include raw request URIs and signed query parameters.
    # Gateway supplies request IDs/status/route logs for those failures.
    error_log /dev/stderr crit;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP"}';
    }

    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location = /auth/google/callback {
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        try_files /index.html =404;
    }

    location = /reset-password {
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        try_files /index.html =404;
    }

    # Internal service paths must never fall through to the public SPA.
    location ^~ /internal/ {
        return 404;
    }

    location /actuator/health {
        proxy_pass http://api-gateway:8080;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
