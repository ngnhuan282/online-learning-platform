server:
  port: ${SERVER_PORT:8083}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
notifications:
  events:
    api-key: ${NOTIFICATION_EVENT_API_KEY:}
spring:
  flyway:
    placeholders:
      notificationCheckKeyword: CHECK
      notificationEventKeyCollation: "CHARACTER SET utf8mb4 COLLATE utf8mb4_bin"
  application:
    name: learning-service
  datasource:
    url: ${LEARNING_DB_URL:jdbc:mysql://localhost:3306/learning_db}
    username: ${LEARNING_DB_USERNAME:learning_app}
    password: ${LEARNING_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:sgedu}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:900}
course:
  service-url: ${COURSE_SERVICE_URL:http://localhost:8082}
integrations:
  internal-service-token: ${INTERNAL_SERVICE_TOKEN}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
