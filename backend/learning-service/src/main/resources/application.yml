server:
  port: ${SERVER_PORT:8083}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
notifications:
  events:
    api-key: ${NOTIFICATION_EVENT_API_KEY:}
spring:
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    placeholders:
      notificationCheckKeyword: CHECK
      notificationEventKeyCollation: "CHARACTER SET utf8mb4 COLLATE utf8mb4_bin"
  application:
    name: learning-service
  datasource:
    url: ${LEARNING_DB_URL:jdbc:mysql://localhost:3306/learning_db}
    username: ${LEARNING_DB_USERNAME:learning_app}
    password: ${LEARNING_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:sgedu}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:900}
course:
  service-url: ${COURSE_SERVICE_URL:http://localhost:8082}
dictation:
  storage-dir: ${DICTATION_STORAGE_DIR:./uploads/dictation}
  import-dir: ${DICTATION_IMPORT_DIR:}
  workbook-storage: ${DICTATION_WORKBOOK_STORAGE:local}
  s3:
    enabled: ${DICTATION_S3_IMPORT_ENABLED:false}
    prefix: ${DICTATION_S3_PREFIX:documents/transcripts/}
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_REGION:ap-southeast-1}
    endpoint: ${AWS_ENDPOINT_URL:}
    force-path-style: ${AWS_S3_FORCE_PATH_STYLE:false}
toeic:
  media:
    local-dir: ${TOEIC_MEDIA_LOCAL_DIR:./uploads/toeic}
    s3-bucket: ${TOEIC_MEDIA_S3_BUCKET:}
    s3-prefix: ${TOEIC_MEDIA_S3_PREFIX:documents/toeic/uploads/}
    s3-region: ${AWS_REGION:ap-southeast-1}
auth:
  service-url: ${AUTH_SERVICE_URL:http://localhost:8081}
integrations:
  internal-service-token: ${INTERNAL_SERVICE_TOKEN}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
