server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      timeout: 5m
      tracking-modes: cookie
      cookie:
        name: GOOGLE_OAUTH_SESSION
        path: /api/v1/auth/google
        http-only: true
        secure: ${REFRESH_COOKIE_SECURE:false}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
spring:
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    test-connection: false
    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.ssl.checkserveridentity]": true
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:mysql://localhost:3306/auth_db}
    username: ${AUTH_DB_USERNAME:auth_app}
    password: ${AUTH_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
app:
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
security:
  password-reset:
    mail-enabled: ${MAIL_ENABLED:false}
    mail-host: ${spring.mail.host}
    mail-port: ${spring.mail.port}
    mail-username: ${spring.mail.username}
    mail-password: ${spring.mail.password}
    mail-from: ${MAIL_FROM:}
    frontend-reset-url: ${FRONTEND_RESET_URL:http://localhost:5173/reset-password}
    token-ttl-minutes: ${RESET_TOKEN_TTL_MINUTES:15}
  google:
    enabled: ${GOOGLE_LOGIN_ENABLED:false}
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback/google}
    frontend-origin: ${GOOGLE_FRONTEND_ORIGIN:http://localhost:5173}
  refresh:
    expiration-seconds: ${REFRESH_TOKEN_EXPIRATION_SECONDS:604800}
    cookie-secure: ${REFRESH_COOKIE_SECURE:false}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:sgedu}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:900}
management:
  health:
    # Auth remains available without SMTP. Delivery is gated by MAIL_ENABLED + complete configuration.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
