server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      timeout: 5m
      tracking-modes: cookie
      cookie:
        name: GOOGLE_OAUTH_SESSION
        path: /api/v1/auth/google
        http-only: true
        secure: ${REFRESH_COOKIE_SECURE:false}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:mysql://localhost:3306/auth_db}
    username: ${AUTH_DB_USERNAME:auth_app}
    password: ${AUTH_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
security:
  google:
    enabled: ${GOOGLE_LOGIN_ENABLED:false}
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback/google}
    frontend-origin: ${GOOGLE_FRONTEND_ORIGIN:http://localhost:5173}
  refresh:
    expiration-seconds: ${REFRESH_TOKEN_EXPIRATION_SECONDS:604800}
    cookie-secure: ${REFRESH_COOKIE_SECURE:false}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:learnsphere}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:900}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
