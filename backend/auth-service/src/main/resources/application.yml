server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:mysql://localhost:3306/auth_db}
    username: ${AUTH_DB_USERNAME:auth_app}
    password: ${AUTH_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
security:
  refresh:
    expiration-seconds: ${REFRESH_TOKEN_EXPIRATION_SECONDS:604800}
    cookie-secure: ${REFRESH_COOKIE_SECURE:false}
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:learnsphere}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:900}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
