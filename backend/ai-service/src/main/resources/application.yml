server:
  port: ${SERVER_PORT:8085}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
spring:
  application:
    name: ai-service
  datasource:
    url: ${AI_DB_URL:jdbc:mysql://localhost:3306/ai_db}
    username: ${AI_DB_USERNAME:ai_app}
    password: ${AI_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:sgedu}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:900}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

integrations:
  ai:
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    request-timeout-ms: ${AI_REQUEST_TIMEOUT_MS:60000}
    daily-request-limit: ${AI_DAILY_REQUEST_LIMIT:100}
    free-daily-request-limit: ${AI_FREE_DAILY_REQUEST_LIMIT:5}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:2048}

course:
  service-url: ${COURSE_SERVICE_URL:http://localhost:8082}
learning:
  service-url: ${LEARNING_SERVICE_URL:http://localhost:8083}

logging:
  level:
    org.springframework.web: INFO
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
