server:
  port: ${SERVER_PORT:8085}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
spring:
  application:
    name: ai-service
  datasource:
    url: ${AI_DB_URL:jdbc:mysql://localhost:3306/ai_db}
    username: ${AI_DB_USERNAME:ai_app}
    password: ${AI_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:sgedu}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:900}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

integrations:
  ai:
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    request-timeout-ms: ${AI_REQUEST_TIMEOUT_MS:15000}

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
