server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: api-gateway
  codec:
    max-in-memory-size: 210MB
  cloud:
    gateway:
      server:
        webflux:
          max-request-body-size: 220200960
          httpclient:
            connect-timeout: 3000
            response-timeout: 300s
            pool:
              max-idle-time: 30s
          routes:
            - id: auth-openapi
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/v3/api-docs,/v3/api-docs/**,/swagger-ui.html,/swagger-ui/**
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/admin/users,/api/v1/admin/users/**,/api/v1/admin/roles,/api/v1/admin/roles/**,/api/v1/admin/permissions,/api/v1/admin/overview,/api/v1/admin/audit
            - id: course-service
              uri: ${COURSE_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/courses/**,/api/v1/categories/**,/api/v1/lessons/**,/api/v1/media/**,/api/v1/admin/**
            - id: learning-service
              uri: ${LEARNING_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/learning/**
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/payments/**
            - id: ai-service
              uri: ${AI_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/ai/**
security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:sgedu}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:900}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,coreDependencies

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
