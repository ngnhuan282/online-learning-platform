server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 10s
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**
            - id: course-service
              uri: ${COURSE_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/courses/**,/api/v1/categories,/api/v1/categories/**,/api/v1/admin/courses,/api/v1/admin/courses/**,/api/v1/admin/categories,/api/v1/admin/categories/**
            - id: learning-service
              uri: ${LEARNING_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/learning/**
            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/payments/**
            - id: ai-service
              uri: ${AI_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/ai/**
security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:learnsphere}
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
