server:
  port: ${SERVER_PORT:8084}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
spring:
  application:
    name: payment-service
  datasource:
    url: ${PAYMENT_DB_URL:jdbc:mysql://localhost:3306/payment_db}
    username: ${PAYMENT_DB_USERNAME:payment_app}
    password: ${PAYMENT_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:learnsphere}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:900}
course:
  service-url: ${COURSE_SERVICE_URL:http://localhost:8082}
learning:
  service-url: ${LEARNING_SERVICE_URL:http://localhost:8083}
integrations:
  internal-service-token: ${INTERNAL_SERVICE_TOKEN}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay/return}
    ipn-url: ${VNPAY_IPN_URL:}
    expire-minutes: ${VNPAY_EXPIRE_MINUTES:15}
    result-url: ${VNPAY_RESULT_URL:http://localhost:5173/payment/result}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
