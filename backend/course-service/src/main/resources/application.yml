server:
  port: ${SERVER_PORT:8082}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
spring:
  application:
    name: course-service
  datasource:
    url: ${COURSE_DB_URL:jdbc:mysql://localhost:3306/course_db}
    username: ${COURSE_DB_USERNAME:course_app}
    password: ${COURSE_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:learnsphere}
    access-token-seconds: ${JWT_ACCESS_TOKEN_SECONDS:900}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

integrations:
  s3:
    region: ${AWS_REGION:}
    bucket: ${AWS_S3_BUCKET:}
